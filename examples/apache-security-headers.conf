# Security headers exported from the Security Headers WordPress plugin.
# Put this block in the <VirtualHost> or in .htaccess (needs mod_headers).
# Remove or switch off the plugin headers you move to the server, so they are not sent twice.
# The report endpoint only accepts reports while the plugin CSP mode is Report-Only or Enforce. If you switch the plugin CSP off, remove report-uri, report-to and Reporting-Endpoints too.
# Send Strict-Transport-Security from the HTTPS server block / virtual host only.
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "browsing-topics=(), camera=(), display-capture=(), geolocation=(), hid=(), microphone=(), midi=(), serial=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"
    Header always set Cross-Origin-Resource-Policy "same-site"
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; object-src 'none'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; report-uri https://example.com/wp-json/security-headers/v1/report; report-to wpsh-csp"
    Header always set Reporting-Endpoints "wpsh-csp=\"https://example.com/wp-json/security-headers/v1/report\""
</IfModule>
