# Security headers exported from the Security Headers WordPress plugin.
# Put these lines in the server { } block. nginx drops inherited add_header
# lines in any location { } block that has its own add_header, so repeat them there.
# Remove or switch off the plugin headers you move to the server, so they are not sent twice.
# The report endpoint only accepts reports while the plugin CSP mode is Report-Only or Enforce. If you switch the plugin CSP off, remove report-uri, report-to and Reporting-Endpoints too.
# Send Strict-Transport-Security from the HTTPS server block / virtual host only.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "browsing-topics=(), camera=(), display-capture=(), geolocation=(), hid=(), microphone=(), midi=(), serial=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; object-src 'none'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; report-uri https://example.com/wp-json/security-headers/v1/report; report-to wpsh-csp" always;
add_header Reporting-Endpoints "wpsh-csp=\"https://example.com/wp-json/security-headers/v1/report\"" always;
